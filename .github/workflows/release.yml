name: Release

# Push a tag like v1.2.1 (matching extension/manifest.json) to publish a release
# with the packaged extension and setup helper attached. Notes come from CHANGELOG.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check tag matches manifest version
        run: |
          version=$(python3 -c 'import json; print(json.load(open("extension/manifest.json"))["version"])')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Tests
        run: |
          node --test extension/tests
          python3 -m unittest discover -s native-host/tests
          shellcheck native-host/*.sh
      - name: Build extension package
        run: python3 native-host/build_xpi.py extension "dist/ytdlp-downloader-$VERSION.xpi"
      - name: Bake setup release assets
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import re
          import shutil

          version = os.environ["VERSION"]
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version):
              raise SystemExit("Invalid release version")
          host = Path("native-host/ytdlp_host.py")
          digest = hashlib.sha256(host.read_bytes()).hexdigest()
          source = Path("native-host/setup.sh").read_text()
          for key, value in (("RELEASE_VERSION", version), ("RELEASE_HOST_SHA256", digest)):
              placeholder = f'{key}=""'
              replacement = f'{key}="{value}"'
              if source.splitlines().count(placeholder) != 1:
                  raise SystemExit(f"Missing or duplicate placeholder: {key}")
              source = source.replace(placeholder, replacement, 1)
              if source.splitlines().count(replacement) != 1 or placeholder in source.splitlines():
                  raise SystemExit(f"Failed to bake {key}")
          Path("dist/setup.sh").write_text(source)
          Path("dist/setup.sh").chmod(0o755)
          shutil.copyfile(host, "dist/ytdlp_host.py")
          PY
          bash -n dist/setup.sh
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]+\]: / { next }
            found { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "No CHANGELOG entry for $VERSION" >&2; exit 1; }
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "dist/ytdlp-downloader-$VERSION.xpi" dist/setup.sh dist/ytdlp_host.py --title "$GITHUB_REF_NAME" --notes-file notes.md
