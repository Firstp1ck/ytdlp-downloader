name: Release

# Push a tag like v1.2.1 (matching extension/manifest.json) to publish a release
# with the packaged extension attached. Notes come from CHANGELOG.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check tag matches manifest version
        run: |
          version=$(python3 -c 'import json; print(json.load(open("extension/manifest.json"))["version"])')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Tests
        run: |
          node --test extension/tests
          python3 -m unittest discover -s native-host/tests
          shellcheck native-host/*.sh
      - name: Build extension package
        run: python3 native-host/build_xpi.py extension "dist/ytdlp-downloader-$VERSION.xpi"
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]+\]: / { next }
            found { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "No CHANGELOG entry for $VERSION" >&2; exit 1; }
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "dist/ytdlp-downloader-$VERSION.xpi" --title "$GITHUB_REF_NAME" --notes-file notes.md
